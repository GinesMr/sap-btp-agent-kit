  # ─────────────────────────────────────────────────────────
  # SECURITY & IDENTITY
  # ─────────────────────────────────────────────────────────

  - id: ias
    name: SAP Identity Authentication Service (IAS)
    category: security-identity
    status: GA
    short_description: >
      Cloud identity provider supporting SAML 2.0, OpenID Connect, and MFA.
      Acts as SP, IdP, or proxy IdP for BTP applications and SAP cloud products.
    best_for:
      - Authenticating users for BTP applications.
      - Federating with corporate IdPs (Azure AD, Okta, ADFS).
      - Enforcing MFA and risk-based authentication.
    avoid_when:
      - Service-to-service auth (use OAuth 2.0 via XSUAA or IAS client credentials).
    prerequisites:
      - IAS tenant (provisioned with BTP global account or separately).
    security_notes:
      - Configure MFA for all admin and privileged users.
      - Restrict risk-based authentication rules.
      - Manage corporate IdP trust carefully.
    runtime: [cloud-foundry, kyma, abap, standalone]
    related_services:
      - ips
      - xsuaa
    official_docs_url: "https://help.sap.com/docs/cloud-identity-services"
    discovery_center_url: "https://discovery-center.cloud.sap/serviceCatalog/identity-authentication"
    verification_status: VERIFIED
    last_verified: "2026-08-10"
    tags: [security, identity, sso, saml, oidc, mfa]

  - id: ips
    name: SAP Identity Provisioning Service (IPS)
    category: security-identity
    status: GA
    short_description: >
      Automates user and group provisioning between identity systems using SCIM.
      Syncs users from LDAP, Azure AD, or IAS to BTP and SAP systems.
    best_for:
      - Automated user lifecycle management.
      - Syncing users from corporate directories to BTP.
    avoid_when:
      - Manual, small-scale user management.
    prerequisites:
      - IPS entitlement (bundled with Cloud Identity Services).
    security_notes:
      - Least privilege for provisioning connectors.
      - Audit user sync operations.
    runtime: [standalone]
    related_services:
      - ias
      - xsuaa
    official_docs_url: "https://help.sap.com/docs/cloud-identity-services"
    discovery_center_url: ""
    verification_status: VERIFIED
    last_verified: "2026-08-10"
    tags: [security, identity, provisioning, scim, user-management]

  - id: xsuaa
    name: Authorization and Trust Management (XSUAA)
    category: security-identity
    status: GA
    short_description: >
      SAP's OAuth 2.0 authorization server on Cloud Foundry. Issues JWT tokens,
      manages scopes, role templates, and role collections for BTP applications.
    best_for:
      - Authorization in CF-based applications.
      - Service-to-service OAuth flows (client credentials).
      - Token exchange for calling backend SAP systems.
    avoid_when:
      - Kyma-native applications (prefer IAS-based OIDC directly).
    prerequisites:
      - CF environment.
      - XSUAA service instance with xs-security.json.
    security_notes:
      - Define minimal scope sets.
      - Do not share XSUAA instances between services.
      - Token expiry: configure short-lived access tokens.
    runtime: [cloud-foundry]
    related_services:
      - ias
      - cap
      - application-router
    official_docs_url: "https://help.sap.com/docs/btp/sap-business-technology-platform/authorization-and-trust-management-in-cloud-foundry-environment"
    discovery_center_url: ""
    verification_status: VERIFIED
    last_verified: "2026-08-10"
    tags: [security, oauth, jwt, authorization, scopes, roles]

